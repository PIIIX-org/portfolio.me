name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Manifests are valid JSON
        run: |
          for f in .claude-plugin/*.json *.json; do
            [ -f "$f" ] || continue
            python3 -m json.tool "$f" > /dev/null && echo "ok   $f"
          done

      - name: Agent frontmatter matches filename
        run: |
          fail=0
          for f in agents/*.md; do
            base=$(basename "$f" .md)
            name=$(awk 'NR>1 && /^name:/ {print $2; exit}' "$f")
            grep -q '^tools:' "$f" || { echo "FAIL $f has no tools:"; fail=1; }
            [ "$name" = "$base" ] || { echo "FAIL $f declares name=$name"; fail=1; }
          done
          [ $fail -eq 0 ] && echo "ok   all agents well-formed"
          exit $fail

      - name: Internal links resolve
        run: |
          fail=0
          while IFS= read -r f; do
            d=$(dirname "$f")
            grep -o '](\.[^)]*\.md)' "$f" 2>/dev/null | sed 's/](\(.*\))/\1/' | while read -r l; do
              [ -f "$d/$l" ] || { echo "BROKEN $f -> $l"; exit 1; }
            done || fail=1
          done < <(find . -name '*.md' -not -path './.git/*')
          [ $fail -eq 0 ] && echo "ok   every internal link resolves"
          exit $fail

      - name: Principle references point at a rule that exists
        run: |
          last=$(grep -o '^## [0-9]\+\.' PRINCIPLES.md | tail -1 | tr -d '#. ')
          bad=$(grep -rhoE '§[0-9]+' --include='*.md' . | tr -d '§' | sort -un | awk -v m="$last" '$1 > m')
          if [ -n "$bad" ]; then echo "FAIL references to non-existent rules: $bad (highest is §$last)"; exit 1; fi
          echo "ok   every §N reference resolves (§0-§$last)"

      - name: Badges are current
        run: python3 scripts/badge.py --check

      - name: README artwork is current
        run: python3 scripts/readme_art.py --check

      - name: README asset paths resolve
        run: |
          fail=0
          for p in $(grep -o 'src="[^"]*"' README.md | sed 's/src="//;s/"//'); do
            [ -f "$p" ] || { echo "MISSING $p"; fail=1; }
          done
          [ $fail -eq 0 ] && echo "ok   every README asset resolves"
          exit $fail

      - name: Preflight self-test
        run: |
          python3 scripts/preflight.py tests/fixtures/clean.html
          if python3 scripts/preflight.py tests/fixtures/dirty.html; then
            echo "FAIL preflight passed a page that violates six rules"; exit 1
          fi
          echo "ok   preflight fails what it should and passes what it should"

      - name: House style
        run: |
          if grep -rInE 'not [a-z]+, but ' --include='*.md' . ; then
            echo "FAIL '§11 not X, but Y' construction found"; exit 1
          fi
          echo "ok   no banned prose constructions"

  refresh-badges:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate counts
        run: |
          python3 scripts/badge.py
          python3 scripts/readme_art.py
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/badges
          git diff --staged --quiet || git commit -m "Refresh badge counts [skip ci]"
          git push

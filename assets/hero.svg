<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-label="portfolio.me. What it refuses to do: no template, no stock photography, no badge service, no fabricated metric, no CDN in production, no silent degradation. 25 binding rules. 5 of them cannot be skipped.">
<title>portfolio.me — the refusal list</title>
<style>
  .fil { animation: heat 4s ease-in-out infinite }
  @keyframes heat { 0%,100% { opacity:.30 } 50% { opacity:.85 } }
  @media (prefers-reduced-motion: reduce) { .fil { animation:none; opacity:.55 } }
</style>
<rect width="880" height="340" rx="14" fill="#0F0E13"/>
<rect x=".5" y=".5" width="879" height="339" rx="14" fill="none" stroke="#FF5C39" stroke-opacity=".28"/>

<text x="56" y="62" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="27" font-weight="700" fill="#FFFFFF">portfolio<tspan fill="#FF5C39">.</tspan>me</text>
<text x="56" y="86" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#B4B7C4">a person, interviewed and positioned, into a portfolio that is live</text>

<line class="fil" x1="56" y1="106" x2="824" y2="106" stroke="#FF5C39" stroke-width="1"/>

<g transform="translate(56,132)"><path d="M0,-4 l7,7 M7,-4 l-7,7" stroke="#FF5C39" stroke-width="1.6" stroke-linecap="round"/><text x="16" y="0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#FFFFFF">no template</text><text x="16" y="15" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6E7D">every run reinvents the components</text></g>
<g transform="translate(470,132)"><path d="M0,-4 l7,7 M7,-4 l-7,7" stroke="#FF5C39" stroke-width="1.6" stroke-linecap="round"/><text x="16" y="0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#FFFFFF">no stock photography</text><text x="16" y="15" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6E7D">the visuals are generated, or they are not used</text></g>
<g transform="translate(56,166)"><path d="M0,-4 l7,7 M7,-4 l-7,7" stroke="#FF5C39" stroke-width="1.6" stroke-linecap="round"/><text x="16" y="0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#FFFFFF">no badge service</text><text x="16" y="15" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6E7D">a dead endpoint should not kill a site</text></g>
<g transform="translate(470,166)"><path d="M0,-4 l7,7 M7,-4 l-7,7" stroke="#FF5C39" stroke-width="1.6" stroke-linecap="round"/><text x="16" y="0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#FFFFFF">no fabricated metric</text><text x="16" y="15" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6E7D">every claim traces to a source</text></g>
<g transform="translate(56,200)"><path d="M0,-4 l7,7 M7,-4 l-7,7" stroke="#FF5C39" stroke-width="1.6" stroke-linecap="round"/><text x="16" y="0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#FFFFFF">no CDN in production</text><text x="16" y="15" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6E7D">vendored, committed, self-hosted</text></g>
<g transform="translate(470,200)"><path d="M0,-4 l7,7 M7,-4 l-7,7" stroke="#FF5C39" stroke-width="1.6" stroke-linecap="round"/><text x="16" y="0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#FFFFFF">no silent degradation</text><text x="16" y="15" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6E7D">skip anything, but the cost is recorded</text></g>

<line x1="56" y1="262" x2="824" y2="262" stroke="#6B6E7D" stroke-opacity=".3" stroke-width="1"/>
<text x="56" y="288" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#B4B7C4">25 binding rules. 5 of them cannot be skipped.</text>
<text x="56" y="308" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#6B6E7D">evidence · accessibility · reversible deploys · the final gate · identity</text>
</svg>

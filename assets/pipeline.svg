<svg xmlns="http://www.w3.org/2000/svg" width="940" height="150" viewBox="0 0 940 150" role="img" aria-label="The pipeline: nine loops from bootstrap to verify, heating left to right. Human gates at A after substance, B1 and B2 during design, and C before deploy.">
